<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Viewer</title>
</head>
<body>

    <h2>Search Book Details</h2>
    <label for="bookSelect">Choose a book: </label>
    <select id="bookSelect">
        <option value="">Select a Book Title</option>
    </select>

    <div id="bookDetails">
        <h3 id="displayTitle"></h3>
        <p><strong>Author:</strong> <span id="displayAuthor"></span></p>
        <p><strong>Published:</strong> <span id="displayYear"></span></p>
        <p><strong>Genres:</strong> <span id="displayGenres"></span></p>
    </div>

    <script>
        const githubRawUrl = 'https://raw.githubusercontent.com/wager435/lab6WebDev/refs/heads/main/books.json';
        
        let booksArray = [];

        fetch(githubRawUrl)
            .then(response => response.json())
            .then(data => {
                booksArray = data.Books; 
                const selectElement = document.getElementById('bookSelect');

                booksArray.forEach((book, index) => {
                    const option = document.createElement('option');
                    option.value = index; 
                    option.textContent = book.title;
                    selectElement.appendChild(option);
                });
            })
            .catch(error => console.error("Error fetching JSON:", error));

        document.getElementById('bookSelect').addEventListener('change', function() {
            const selectedIndex = this.value;
            const detailsDiv = document.getElementById('bookDetails');

            if (selectedIndex !== "") {
                const selectedBook = booksArray[selectedIndex];

                document.getElementById('displayTitle').textContent = selectedBook.title;
                document.getElementById('displayAuthor').textContent = selectedBook.author;
                document.getElementById('displayYear').textContent = selectedBook.publicationYear;
                document.getElementById('displayGenres').textContent = selectedBook.genres.join(', ');

                detailsDiv.style.display = 'block';
            } else {
                detailsDiv.style.display = 'none';
            }
        });
    </script>

</body>
</html>
